services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipe_pantry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["recipe_pantry_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_pantry"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  recipe_pantry_data:
